  - name: Configure Proxmox hosts
    hosts: proxmox

    tasks:

      # ---------------------------------------------------------
      # Step 1.4: Configure Proxmox repositories
      # ---------------------------------------------------------

      - name: Disable Proxmox enterprise repository
        ansible.builtin.file:
          path: /etc/apt/sources.list.d/pve-enterprise.sources
          state: absent

      - name: Disable Ceph enterprise repository
        ansible.builtin.file:
          path: /etc/apt/sources.list.d/ceph.sources
          state: absent

      - name: Enable Proxmox no-subscription repository
        ansible.builtin.copy:
          dest: /etc/apt/sources.list.d/pve-no-subscription.sources
          owner: root
          group: root
          mode: "0644"
          content: |
            Types: deb
            URIs: http://download.proxmox.com/debian/pve
            Suites: trixie
            Components: pve-no-subscription
            Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

      - name: Update APT cache
        ansible.builtin.apt:
          update_cache: true


      # ---------------------------------------------------------
      # Step 1.5: Remove Proxmox subscription warning
      # ---------------------------------------------------------

      - name: Install subscription nag removal script
        ansible.builtin.copy:
          dest: /usr/local/bin/remove-proxmox-subscription-nag
          owner: root
          group: root
          mode: "0755"
          content: |
            #!/bin/sh
            
            FILE="/usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js"
            
            if dpkg -V proxmox-widget-toolkit | grep -q '/proxmoxlib\.js$'; then
                exit 0
            fi
            
            sed -i \
              "s/res\.data\.status\.toLowerCase() !== 'active'/false/g" \
              "$FILE"
        register: nag_script

      - name: Install subscription nag APT hook
        ansible.builtin.copy:
          dest: /etc/apt/apt.conf.d/no-nag-script
          owner: root
          group: root
          mode: "0644"
          content: |
            DPkg::Post-Invoke { "/usr/local/bin/remove-proxmox-subscription-nag || true"; };
        register: nag_hook

      - name: Apply subscription nag removal
        ansible.builtin.command:
          cmd: apt-get install --reinstall -y proxmox-widget-toolkit
        when: nag_script.changed or nag_hook.changed


      # ---------------------------------------------------------
      # Step 1.6: Upgrade and reboot Proxmox hosts
      # ---------------------------------------------------------

      - name: Upgrade installed packages
        ansible.builtin.apt:
          upgrade: dist
          update_cache: true
        register: package_upgrade

      - name: Reboot Proxmox hosts
        ansible.builtin.reboot:
          reboot_timeout: 600
        when: package_upgrade.changed


      # ---------------------------------------------------------
      # Step 1.7: Configure common Proxmox host settings
      # ---------------------------------------------------------

      - name: Set Proxmox hostname
        ansible.builtin.hostname:
          name: "{{ inventory_hostname }}"

      - name: Configure Proxmox host entries
        ansible.builtin.blockinfile:
          path: /etc/hosts
          block: |
            {% for host in groups['proxmox'] %}
            {{ hostvars[host]['ansible_host'] }} {{ host }}
            {% endfor %}
      # ---------------------------------------------------------
      # Step 1.8: Final connectivity check
      # ---------------------------------------------------------

      - name: Check Proxmox host connectivity
        ansible.builtin.command:
          cmd: ping -c 1 {{ item }}
        loop: "{{ groups['proxmox'] }}"
        changed_when: false

      # ---------------------------------------------------------
      # Step 1.9: Create Proxmox cluster
      # ---------------------------------------------------------

      - name: Initialize Proxmox cluster
        ansible.builtin.command:
          cmd: pvecm create homelab --link0 192.168.8.21
          creates: /etc/pve/corosync.conf
        when: inventory_hostname == 'pve01'

      - name: Read pve01 SSH host key
        ansible.builtin.slurp:
          src: /etc/ssh/ssh_host_ed25519_key.pub
        delegate_to: pve01
        run_once: true
        register: pve01_host_key

      - name: Trust pve01 SSH host key
        ansible.builtin.known_hosts:
          path: /root/.ssh/known_hosts
          name: "{{ hostvars['pve01']['ansible_host'] }}"
          key: "{{ hostvars['pve01']['ansible_host'] }} {{ (pve01_host_key.content | b64decode).split()[0] }} {{ (pve01_host_key.content | b64decode).split()[1] }}"
          state: present
        when: inventory_hostname != 'pve01'

      - name: Read joining node SSH public key
        ansible.builtin.slurp:
          src: /root/.ssh/id_rsa.pub
        register: joining_node_key
        when: inventory_hostname != 'pve01'

      - name: Authorize joining node on pve01
        ansible.posix.authorized_key:
          user: root
          key: "{{ joining_node_key.content | b64decode }}"
          state: present
        delegate_to: pve01
        when: inventory_hostname != 'pve01'
        throttle: 1

      - name: Join Proxmox cluster
        ansible.builtin.command:
          cmd: pvecm add 192.168.8.21 --use_ssh
          creates: /etc/pve/corosync.conf
        when: inventory_hostname != 'pve01'
        throttle: 1

  # ---------------------------------------------------------
  # Step 1.10: Configure Terraform API access
  # ---------------------------------------------------------

  - name: Configure Terraform API authentication
    hosts: pve01

    tasks:
      - name: Check existing Terraform API token
        ansible.builtin.command:
          cmd: pveum user token list root@pam --output-format json
        register: existing_tokens
        changed_when: false

      - name: Create Terraform API token
        ansible.builtin.command:
          cmd: pveum user token add root@pam terraform --privsep 0 --output-format json
        register: terraform_token
        when: >
          'terraform' not in
          (existing_tokens.stdout | from_json |
          map(attribute='tokenid') | list)
        no_log: true

      - name: Save Terraform API token locally
        ansible.builtin.copy:
          dest: "{{ playbook_dir }}/terraform-api-token.env"
          content: |
            export PROXMOX_VE_API_TOKEN='root@pam!terraform={{ (terraform_token.stdout | from_json).value }}'
          mode: "0600"
        delegate_to: localhost
        when: terraform_token is changed
        no_log: true

  # ---------------------------------------------------------
  # Step 2.4: Prepare Ubuntu cloud-init templates
  # ---------------------------------------------------------

  - name: Prepare Ubuntu cloud-init template
    hosts: pve01

    tasks:
      - name: Download Ubuntu 24.04 cloud image
        ansible.builtin.get_url:
          url: "{{ ubuntu_image_url }}"
          dest: "{{ ubuntu_image_path }}"
          mode: "0644"

      # ---------------------------------------------------------
      # Create Ubuntu base VMs
      # ---------------------------------------------------------

      - name: Create Ubuntu base VM
        ansible.builtin.command:
          cmd: >
            qm create {{ template_base_id }}
            --name {{ template_name }}
            --memory {{ template_memory }}
            --cores {{ template_cores }}
            --net0 {{ template_network_model }},bridge={{ template_bridge }}
            --scsihw {{ template_scsi_controller }}
            --ostype {{ template_os_type }}
          creates: "/etc/pve/nodes/{{ inventory_hostname }}/qemu-server/{{ template_base_id }}.conf"