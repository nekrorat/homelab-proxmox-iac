
# ---------------------------------------------------------
# Step 4.1: Configure Kubernetes prerequisites
# ---------------------------------------------------------

- name: Prepare Ubuntu VMs for Kubernetes
  hosts: kubernetes
  become: true

  vars_files:
    - group_vars/kubernetes.yaml

  tasks:
    # Disable swap

    - name: Disable active swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_facts['swaptotal_mb'] > 0

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]\S*\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    # Enable IPv4 packet forwarding

    - name: Enable IPv4 packet forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        sysctl_set: true
        reload: true


# ---------------------------------------------------------
# Step 4.2: Install and configure containerd
# ---------------------------------------------------------

- name: Configure Kubernetes nodes
  hosts: kubernetes
  become: true

  vars_files:
    - group_vars/kubernetes.yaml

  tasks:
    # Install containerd from the Docker APT repository

    - name: Install APT prerequisites
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: true

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    # Configure the containerd runtime for Kubernetes

    - name: Generate containerd default configuration
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_config
      changed_when: false

    - name: Configure containerd
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        mode: "0644"
        content: "{{ containerd_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') ~ '\n' }}"
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started

    # ---------------------------------------------------------
    # Step 4.3: Install Kubernetes components
    # ---------------------------------------------------------

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "{{ kubernetes_repo_key_url }}"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Configure Kubernetes APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ kubernetes_repo_url }}
          Suites: /
          Signed-By: /etc/apt/keyrings/kubernetes.asc

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted

# ---------------------------------------------------------
# Step 4.4: Initialize Kubernetes control plane
# ---------------------------------------------------------

- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true

  tasks:
    - name: Initialize control plane with kubeadm
      ansible.builtin.command:
        cmd: kubeadm init
        creates: /etc/kubernetes/admin.conf
      no_log: true

    - name: Create kubectl configuration directory
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Configure kubectl access
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"


# ---------------------------------------------------------
# Step 4.6: Join Kubernetes worker nodes
# ---------------------------------------------------------

- name: Generate Kubernetes worker join command
  hosts: control_plane
  become: true

  tasks:
    - name: Generate join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: kubeadm_join
      changed_when: false
      no_log: true

    - name: Share join command with worker nodes
      ansible.builtin.set_fact:
        kubernetes_join_command: "{{ kubeadm_join.stdout }}"
      no_log: true


- name: Join Kubernetes worker nodes
  hosts: workers
  become: true

  tasks:
    - name: Join worker to Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['control_plane'][0]]['kubernetes_join_command'] }}"
        creates: /etc/kubernetes/kubelet.conf
      no_log: true


# ---------------------------------------------------------
# Step 4.6: Install Helm
# ---------------------------------------------------------

- name: Install Helm
  hosts: control_plane
  become: true

  vars_files:
    - group_vars/kubernetes.yaml

  tasks:
    - name: Install Helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        extra_opts:
          - --strip-components=1
        include:
          - linux-amd64/helm
        owner: root
        group: root
        mode: "0755"
        remote_src: true
        creates: /usr/local/bin/helm

# ---------------------------------------------------------
# Step 4.7: Install Cilium CNI
# ---------------------------------------------------------

- name: Install Cilium CNI
  hosts: control_plane
  become: false

  vars_files:
    - group_vars/kubernetes.yaml

  tasks:
    - name: Check whether Cilium is installed
      ansible.builtin.command:
        cmd: helm status cilium --namespace kube-system
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: cilium_status
      changed_when: false
      failed_when: false

    - name: Install Cilium
      ansible.builtin.command:
        argv:
          - helm
          - install
          - cilium
          - oci://quay.io/cilium/charts/cilium
          - --version
          - "{{ cilium_version }}"
          - --namespace
          - kube-system
          - --wait
          - --timeout
          - 10m
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      when: cilium_status.rc != 0

# ---------------------------------------------------------
# Step 4.8: Configure kubectl alias and autocompletion
# ---------------------------------------------------------

- name: Configure kubectl shell shortcuts
  hosts: kubernetes
  become: true

  tasks:
    - name: Install Bash completion
      ansible.builtin.apt:
        name: bash-completion
        state: present

    - name: Generate kubectl Bash completion
      ansible.builtin.command:
        cmd: kubectl completion bash
      register: kubectl_completion
      changed_when: false

    - name: Install kubectl Bash completion
      ansible.builtin.copy:
        dest: /etc/bash_completion.d/kubectl
        content: "{{ kubectl_completion.stdout }}\n"
        mode: "0644"

    - name: Configure kubectl alias and completion
      ansible.builtin.blockinfile:
        path: /home/ubuntu/.bashrc
        marker: "# {mark} ANSIBLE MANAGED KUBECTL SHORTCUTS"
        block: |
          alias k=kubectl
          complete -o default -F __start_kubectl k


# ---------------------------------------------------------
# Step 4.9: Validate Kubernetes Pod deployment
# ---------------------------------------------------------

- name: Test Kubernetes Pod deployment
  hosts: control_plane
  become: false
  tags: smoke-test

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

  tasks:
    - name: Run temporary test Pod
      block:
        - name: Create NGINX test Pod
          ansible.builtin.command:
            cmd: kubectl run nginx-test --image=nginx:stable --restart=Never

        - name: Wait for test Pod to become Ready
          ansible.builtin.command:
            cmd: kubectl wait --for=condition=Ready pod/nginx-test --timeout=120s
          changed_when: false

        - name: Display test Pod details
          ansible.builtin.command:
            cmd: kubectl get pod nginx-test -o wide
          register: test_pod
          changed_when: false

        - name: Show test results
          ansible.builtin.debug:
            msg: "{{ test_pod.stdout_lines }}"

      always:
        - name: Delete test Pod
          ansible.builtin.command:
            cmd: kubectl delete pod nginx-test --ignore-not-found=true --wait=true
