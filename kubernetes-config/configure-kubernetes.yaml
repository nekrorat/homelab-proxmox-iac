
# ---------------------------------------------------------
# Step 4.1: Configure Kubernetes prerequisites
# ---------------------------------------------------------

- name: Prepare Ubuntu VMs for Kubernetes
  hosts: kubernetes
  become: true

  vars_files:
    - group_vars/kubernetes.yaml

  tasks:
    # Disable swap

    - name: Disable active swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_facts['swaptotal_mb'] > 0

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]\S*\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    # Enable IPv4 packet forwarding

    - name: Enable IPv4 packet forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        sysctl_set: true
        reload: true


# ---------------------------------------------------------
# Step 4.2: Install and configure containerd
# ---------------------------------------------------------

- name: Configure Kubernetes nodes
  hosts: kubernetes
  become: true

  tasks:
    # Install containerd from the Docker APT repository

    - name: Install APT prerequisites
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: true

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    # Configure the containerd runtime for Kubernetes

    - name: Generate containerd default configuration
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_config
      changed_when: false

    - name: Configure containerd
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        mode: "0644"
        content: "{{ containerd_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') ~ '\n' }}"
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started

    # ---------------------------------------------------------
    # Step 4.3: Install Kubernetes components
    # ---------------------------------------------------------

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "{{ kubernetes_repo_key_url }}"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: "0644"

    - name: Configure Kubernetes APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ kubernetes_repo_url }}
          Suites: /
          Signed-By: /etc/apt/keyrings/kubernetes.asc

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
